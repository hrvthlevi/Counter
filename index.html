<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Behavior & Transitions Analyzer</title>
    <link rel="stylesheet" href="stilus.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Behavior & Transitions Analyzer</h1>
      <div class="section">
        <h2>Input Data</h2>
        <div class="input-container">
          <input type="text" id="animal-id" placeholder="Animal ID (e.g. A1)" />
          <textarea id="raw-data-input" placeholder="Paste raw data (Time & Behavior, e.g.: 10   A1_Anogenital sniffing)"></textarea>
          <button id="process-button">Process Data</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #555; margin: 20px 0;">
      <div class="section">
        <h2>Behaviors and Durations</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Animal ID</th>
                <th>Behavior</th>
                <th>Start</th>
                <th>End</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="eredmenyek-torzs"></tbody>
          </table>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #555; margin: 20px 0;">
      <div class="section">
        <h2>Transitions Analysis</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Current</th>
                <th>Next</th>
                <th>Count</th>
              </tr>
            </thead>
            <tbody id="transitions-torzs"></tbody>
          </table>
        </div>
      </div>
      <div class="export-container">
        <button id="export-all-csv" style="background: #28a745;">Export All to Single CSV</button>
      </div>

    </div>
  </body>
</html>
